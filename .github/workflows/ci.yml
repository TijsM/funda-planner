name: CI

on:
  push: { branches: [main, v2] }
  pull_request:

jobs:
  engine:
    name: typecheck + engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: browser tests (shipped build)
    runs-on: ubuntu-latest
    # the password gate reads these at request time, so without them every spec
    # boots into the login screen. Only on this job — `pnpm build` in `engine`
    # must keep passing with no secrets at all.
    env:
      APP_LOGIN: ci-dummy-password
      SESSION_SECRET: ci-dummy-session-secret-not-used-anywhere-real
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --project=chromium
      - name: same suite against the React port
        run: pnpm exec playwright test --project=chromium
        env: { E2E_TARGET: next }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report/, retention-days: 7 }
