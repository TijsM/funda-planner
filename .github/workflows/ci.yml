name: CI

on:
  push: { branches: [main, v2] }
  pull_request:

jobs:
  engine:
    name: typecheck + engine tests
    runs-on: ubuntu-latest
    # Not one secret on this job, and that is the invariant it exists to hold:
    # `pnpm build` has to succeed with no Supabase credentials, because the
    # config reads `process.env.NEXT_PUBLIC_…` fresh on every call rather than
    # baking a mode into the bundle. A secret added here would make a build that
    # only works when configured pass silently.
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose — package.json's `packageManager` field is
      # the single source of truth, and specifying both makes action-setup exit
      # with "Multiple versions of pnpm specified" before a single step runs.
      - uses: pnpm/action-setup@v4
      # 22, not 20: @supabase/supabase-js declares engines node >=22.
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: browser tests (shipped build)
    runs-on: ubuntu-latest
    # No secrets, deliberately. The suite runs the app in local mode — no
    # Supabase credentials, therefore no accounts and no gate — which is a
    # supported deployment and the one a laptop gets. The gate is covered by the
    # separate E2E_GATE run below, which starts its own server with dummy
    # credentials that point at a host that cannot resolve.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --project=chromium
      - name: same suite against the React port
        run: pnpm exec playwright test --project=chromium
        env: { E2E_TARGET: next }
      # Its own invocation, not a third project alongside the others: two
      # `next dev` processes cannot share one `.next` directory, and Playwright
      # starts every webServer in the config no matter which project was picked.
      - name: the gate, armed
        run: pnpm exec playwright test --project=gate
        env: { E2E_GATE: '1' }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report/, retention-days: 7 }
